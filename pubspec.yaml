name: astra_computer_academy
description: Offline-first interactive computer learning app foundation.
publish_to: 'none'
version: 1.1.0+21

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  pdf: 3.12.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/curriculum.json
    - assets/content/class5_cursor_pro.json
    - assets/content/class5_coverage_manifest.json
    - assets/visuals/class5/
