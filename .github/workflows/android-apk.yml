name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'scripts/**'
      - 'tool/android_overlay/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Create compatible Android scaffold
        run: ./scripts/bootstrap_android.sh

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ASTRA_COMPUTER_ACADEMY_v1.0.1.apk
          sha256sum dist/ASTRA_COMPUTER_ACADEMY_v1.0.1.apk > dist/ASTRA_COMPUTER_ACADEMY_v1.0.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-COMPUTER-ACADEMY-v1.0.1-APK
          path: dist/*
          if-no-files-found: error
